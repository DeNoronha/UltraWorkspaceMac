# Publishes UltraWorkspaceMac/site (plain HTML, no build) to GitHub Pages.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
    paths: ["UltraWorkspaceMac/site/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  # Daily, so the most upvoted ideas on Contact (community/ideas.json) stay current.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The site serves the newest release's DMG itself (site/download/): that works while the
      # repository is private, and it follows pre-releases, which GitHub's "latest" link skips.
      - name: Fetch the newest Deckhand DMG into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Newest non-draft release (pre-releases included). Without one, or without a
          # Deckhand.dmg on it, the site still deploys; only the download is missing.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "::warning::No release found; deploying the site without a DMG"
            exit 0
          fi
          mkdir -p UltraWorkspaceMac/site/download
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern Deckhand.dmg --clobber --dir UltraWorkspaceMac/site/download; then
            echo "::warning::Release $tag has no Deckhand.dmg asset; deploying the site without a DMG"
            exit 0
          fi
          size=$(stat -c %s UltraWorkspaceMac/site/download/Deckhand.dmg)
          # The DMG's SHA-256 goes into latest.json and onto the download buttons (SECURITY.md, supply chain):
          # anyone can compare the file they got with what the workflow hashed at publish time.
          sha256=$(sha256sum UltraWorkspaceMac/site/download/Deckhand.dmg | cut -d' ' -f1)
          published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          printf '{"tag":"%s","size":%s,"published":"%s","sha256":"%s"}\n' "$tag" "$size" "$published" "$sha256" > UltraWorkspaceMac/site/download/latest.json
          cat UltraWorkspaceMac/site/download/latest.json
      # The most upvoted ideas from Discussions → Ideas for the Contact page. Public data only (title, link,
      # upvotes, comments); on any failure the page just links to the Ideas category.
      - name: Fetch the top ideas from GitHub Discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p UltraWorkspaceMac/site/community
          owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
          cat_id=$(gh api graphql -f owner="$owner" -f repo="$repo" -f query='
            query($owner:String!,$repo:String!){ repository(owner:$owner,name:$repo){ discussionCategory(slug:"ideas"){ id } } }' \
            --jq '.data.repository.discussionCategory.id // empty')
          if [ -n "$cat_id" ] && gh api graphql -f owner="$owner" -f repo="$repo" -f cat="$cat_id" -f query='
            query($owner:String!,$repo:String!,$cat:ID!){ repository(owner:$owner,name:$repo){
              discussions(first:100, categoryId:$cat, states:OPEN, orderBy:{field:UPDATED_AT,direction:DESC}){
                nodes{ title url upvoteCount comments{ totalCount } } } } }' \
            --jq '[.data.repository.discussions.nodes[]
                   | {title, url, upvotes: .upvoteCount, comments: .comments.totalCount}]
                  | sort_by(-.upvotes) | .[:10]
                  | {updated: (now | todate), ideas: .}' > UltraWorkspaceMac/site/community/ideas.json; then
            cat UltraWorkspaceMac/site/community/ideas.json
          else
            echo "::warning::Could not read Discussions → Ideas; deploying without ideas.json"
            rm -f UltraWorkspaceMac/site/community/ideas.json
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: UltraWorkspaceMac/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
