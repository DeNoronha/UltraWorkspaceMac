# Publishes UltraWorkspaceMac/site (plain HTML, no build) to GitHub Pages.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
    paths: ["UltraWorkspaceMac/site/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site serves the newest release's DMG itself (site/download/): that works while the
      # repository is private, and it follows pre-releases, which GitHub's "latest" link skips.
      - name: Fetch the newest Deckhand DMG into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          mkdir -p UltraWorkspaceMac/site/download
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern Deckhand.dmg --dir UltraWorkspaceMac/site/download
          size=$(stat -c %s UltraWorkspaceMac/site/download/Deckhand.dmg)
          published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          printf '{"tag":"%s","size":%s,"published":"%s"}\n' "$tag" "$size" "$published" > UltraWorkspaceMac/site/download/latest.json
          cat UltraWorkspaceMac/site/download/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: UltraWorkspaceMac/site
      - id: deployment
        uses: actions/deploy-pages@v4
